<!DOCTYPE html>
<html lang="en">

<head>


    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ComicCraft - AI Comic Generator</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>

<body>

<header class="navbar">

    <div class="logo">
        🎨 ComicCraft
    </div>

    <nav>

        <a href="/">Create</a>

        <a href="/history">History</a>

    </nav>

</header>


<main class="container">

    <section class="hero">

        <div>

            <span class="badge">
                AI POWERED
            </span>

            <h1>
                Create Your Own Comic
            </h1>

            <p>
                Turn your characters and story ideas
                into an original comic script with
                AI-powered storytelling.
            </p>

        </div>

    </section>


    <section class="card">

        <h2>
            Create a New Comic
        </h2>

        <form
            id="comic-form"
            action="/generate"
            method="post"
        >

            <div class="form-grid">

                <div class="form-group">

                    <label for="creator_name">
                        Creator Name
                    </label>

                    <input
                        type="text"
                        id="creator_name"
                        name="creator_name"
                        placeholder="Your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="title">
                        Comic Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="The Last Star"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="genre">
                        Genre
                    </label>

                    <select
                        id="genre"
                        name="genre"
                        required
                    >

                        <option value="">
                            Select genre
                        </option>

                        <option>Superhero</option>

                        <option>Adventure</option>

                        <option>Comedy</option>

                        <option>Fantasy</option>

                        <option>Science Fiction</option>

                        <option>Mystery</option>

                        <option>Horror</option>

                        <option>Romance</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="style">
                        Art Style
                    </label>

                    <select
                        id="style"
                        name="style"
                        required
                    >

                        <option value="">
                            Select style
                        </option>

                        <option>Modern Comic</option>

                        <option>Manga</option>

                        <option>Cartoon</option>

                        <option>Noir</option>

                        <option>Watercolor</option>

                        <option>Pixel Art</option>

                    </select>

                </div>

            </div>


            <div class="form-group">

                <label for="character_description">
                    Character Description
                </label>

                <textarea
                    id="character_description"
                    name="character_description"
                    rows="5"
                    placeholder="Describe the main character, appearance, personality and abilities..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="story_idea">
                    Story Idea
                </label>

                <textarea
                    id="story_idea"
                    name="story_idea"
                    rows="7"
                    placeholder="Describe what should happen in your comic..."
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="panel_count">
                    Number of Panels
                </label>

                <input
                    type="number"
                    id="panel_count"
                    name="panel_count"
                    min="2"
                    max="12"
                    value="6"
                    required
                >

            </div>


            <div
                id="loading"
                class="loading hidden"
            >
                Creating your comic...
            </div>


            <button
                type="submit"
                class="primary-button"
            >
                ✨ Generate Comic
            </button>

        </form>

    </section>

</main>


<footer>

    <p>
        ComicCraft &copy; 2026
    </p>

</footer>


<script
    src="{{ url_for('static', path='js/script.js') }}"
></script>

</body>

</html>
